[package]
name = "riotswitcher-core"
version = "0.6.0"
description = "Lógica de RiotSwitcher sin dependencias de Tauri"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }

[dev-dependencies]
tempfile = "3.27.0"
